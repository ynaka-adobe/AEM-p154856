# Fastly Compute package for the xsc-demo CUG + Okta edge function.
authors = []
cloned_from = "https://github.com/adobe/aem-edge-functions-boilerplate"
description = "xsc-demo Closed User Groups with Okta login"
language = "javascript"
manifest_version = 3
name = "xsc-demo-cug"
service_id = ""

[scripts]
  build = "npm run build"
  post_init = "npm install"

[local_server]
  [local_server.backends]
    [local_server.backends.origin]
      url = "https://main--xsc-demo--ynaka-adobe.aem.live"

  [local_server.config_stores]
    [local_server.config_stores.config_default]
      format = "inline-toml"
    [local_server.config_stores.config_default.contents]
      XSC_PUBLIC_ORIGIN = "http://127.0.0.1:7676"
      XSC_OKTA_ISSUER = "https://trial-5076725.okta.com"
      XSC_OKTA_CLIENT_ID = "0oa18l1budg5m7Fnh698"

  [local_server.secret_stores]
    [[local_server.secret_stores.secret_default]]
      key = "XSC_SESSION_SECRET"
      data = "local-dev-only-session-secret-change-me-0123456789"
    [[local_server.secret_stores.secret_default]]
      key = "XSC_OKTA_CLIENT_SECRET"
      data = "local-dev-only"
