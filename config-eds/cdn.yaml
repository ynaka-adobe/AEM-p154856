    origins:
      - name: 3m-www
        domain: www.3m.com
        forwardHost: false
        forwardCookie: true
        forwardAuthorization: true
      - name: order-3m
        domain: order.3m.com
        forwardHost: false
        forwardCookie: true
        forwardAuthorization: true
      - name: parker-eds
        domain: main--parker--ynaka-adobe.aem.network
        forwardHost: false
        forwardCookie: true
        forwardAuthorization: true
      - name: chevron-edge-commerce-pilot
        domain: main--chevronlubricants--ynaka-adobe.aem.network
        forwardHost: false
        forwardCookie: true
        forwardAuthorization: true
  requestTransformations:
    rules:
      # Rewrite our /mmm/login alias to 3M's real B2B ordering-portal login
      # path before forwarding to the order-3m origin above.
      - name: rewrite-3m-mmm-login
        when:
          allOf:
            - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - { reqProperty: originalPath, matches: "^/([a-z]{2}/)?mmm/login/?$" }
        actions:
          - type: transform
            reqProperty: path
            op: replace
            match: "^/([a-z]{2}/)?mmm/login/?$"
            replacement: "/store/bComUSSite/en_US/login"
      # The /mmm (or /<lang>/mmm) path is only a routing alias on our side;
      # www.3m.com has no such path, so forwarding it verbatim returns 3M's
      # own 404 page. Rewrite it to "/" so the real 3m.com homepage loads.
      - name: normalize-3m-mmm-root
        when:
          allOf:
            - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - { reqProperty: originalPath, matches: "^/([a-z]{2}/)?mmm/?$" }
        actions:
          - type: transform
            reqProperty: path
            op: replace
            match: "^/([a-z]{2}/)?mmm/?$"
            replacement: "/"
      # Legacy AEM URLs: serve /us/en/page.html from the EDS page /us/en/page,
      # keeping .html in the browser address bar (no redirect).
      # Skips EDS fragments (*.plain.html) and code paths.
      - name: serve-html-extension
        when:
          allOf:
            - anyOf:
                - { reqProperty: domain, equals: "toyotafinancial.ynaka-adobe.com" }
                - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - anyOf:
              - { reqProperty: domain, equals: "toyotafinancial.ynaka-adobe.com" }
              - { reqProperty: originalPath, doesNotMatch: "^/([a-z]{2}/)?mmm(/|$)" }
            - { reqProperty: path, matches: "\\.html$" }
            - { reqProperty: path, doesNotMatch: "\\.plain\\.html$" }
            - { reqProperty: path, doesNotMatch: "^/(404|head)\\.html$" }
            - { reqProperty: path, doesNotMatch: "^/(blocks|scripts|styles|tools|plugins|deps|ue|icons|fonts|workers|\\.well-known|well-known)/" }
        actions:
          - type: transform
            reqProperty: path
            op: replace
            match: '\.html$'
            replacement: ""
