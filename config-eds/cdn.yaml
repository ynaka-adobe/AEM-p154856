# Adobe Managed CDN configuration, deployed by a Cloud Manager
# Edge Delivery Configuration Pipeline (not used by aem.live itself).
kind: "CDN"
version: "1"
data:
  originSelectors:
    rules:
      # /mmm/login (and /<lang>/mmm/login) is a demo alias for 3M's B2B
      # ordering-portal login, which lives on a different subdomain/path
      # than www.3m.com. Must be matched (and listed) before the generic
      # route-3m-mmm rule below, since that rule's path pattern would
      # otherwise also match "/mmm/login" and send it to www.3m.com instead.
      - name: route-3m-mmm-login
        when:
          allOf:
            - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - { reqProperty: originalPath, matches: "^/([a-z]{2}/)?mmm/login/?$" }
        action:
          type: selectOrigin
          originName: order-3m
          skipCache: true
      - name: route-3m-mmm
        when:
          allOf:
            - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - { reqProperty: originalPath, matches: "^/([a-z]{2}/)?mmm(/|$)" }
        action:
          type: selectOrigin
          originName: 3m-www
          skipCache: true
      # www.3m.com pages reference these asset paths as root-relative URLs
      # (e.g. /en_US/..., /3m_theme_assets/...). Once the browser is on
      # 3m.ynaka-adobe.com (from the route-3m-mmm proxy above), those
      # root-relative requests land back on this domain instead of
      # www.3m.com, so they must also be sent to the 3m-www origin.
      - name: route-3m-mmm-assets
        when:
          allOf:
            - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - anyOf:
                - { reqProperty: path, matches: "^/en_US/" }
                - { reqProperty: path, matches: "^/3m_theme_assets/" }
                - { reqProperty: path, matches: "^/3M/" }
                - { reqProperty: path, matches: "^/etc\\.clientlibs/" }
                - { reqProperty: path, matches: "^/etc/" }
                - { reqProperty: path, matches: "^/content/dam/" }
                - { reqProperty: path, matches: "^/wps/" }
                - { reqProperty: path, matches: "^/akam/" }
                - { reqProperty: path, equals: "/favicon.ico" }
        action:
          type: selectOrigin
          originName: 3m-www
          skipCache: true
      - name: route-persona-home
        when:
          allOf:
            - { reqProperty: domain, equals: "dupont.ynaka-adobe.com" }
            - { reqProperty: path, equals: "/" }
        action: { type: selectAemOrigin, originName: edgefunction-my-edge-function, skipCache: true }
    origins:
      - name: 3m-www
        domain: www.3m.com
        forwardHost: false
        forwardCookie: true
        forwardAuthorization: true
      - name: order-3m
        domain: order.3m.com
        forwardHost: false
        forwardCookie: true
        forwardAuthorization: true
  requestTransformations:
    rules:
      # Rewrite our /mmm/login alias to 3M's real B2B ordering-portal login
      # path before forwarding to the order-3m origin above.
      - name: rewrite-3m-mmm-login
        when:
          allOf:
            - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - { reqProperty: originalPath, matches: "^/([a-z]{2}/)?mmm/login/?$" }
        actions:
          - type: transform
            reqProperty: path
            op: replace
            match: "^/([a-z]{2}/)?mmm/login/?$"
            replacement: "/store/bComUSSite/en_US/login"
      # The /mmm (or /<lang>/mmm) path is only a routing alias on our side;
      # www.3m.com has no such path, so forwarding it verbatim returns 3M's
      # own 404 page. Rewrite it to "/" so the real 3m.com homepage loads.
      - name: normalize-3m-mmm-root
        when:
          allOf:
            - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - { reqProperty: originalPath, matches: "^/([a-z]{2}/)?mmm/?$" }
        actions:
          - type: transform
            reqProperty: path
            op: replace
            match: "^/([a-z]{2}/)?mmm/?$"
            replacement: "/"
      # Legacy AEM URLs: serve /us/en/page.html from the EDS page /us/en/page,
      # keeping .html in the browser address bar (no redirect).
      # Skips EDS fragments (*.plain.html) and code paths.
      - name: serve-html-extension
        when:
          allOf:
            - anyOf:
                - { reqProperty: domain, equals: "toyotafinancial.ynaka-adobe.com" }
                - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - anyOf:
              - { reqProperty: domain, equals: "toyotafinancial.ynaka-adobe.com" }
              - { reqProperty: originalPath, doesNotMatch: "^/([a-z]{2}/)?mmm(/|$)" }
            - { reqProperty: path, matches: "\\.html$" }
            - { reqProperty: path, doesNotMatch: "\\.plain\\.html$" }
            - { reqProperty: path, doesNotMatch: "^/(404|head)\\.html$" }
            - { reqProperty: path, doesNotMatch: "^/(blocks|scripts|styles|tools|plugins|deps|ue|icons|fonts|workers|\\.well-known|well-known)/" }
        actions:
          - type: transform
            reqProperty: path
            op: replace
            match: '\.html$'
            replacement: ""
