# Adobe Managed CDN configuration, deployed by a Cloud Manager
# Edge Delivery Configuration Pipeline (not used by aem.live itself).
kind: "CDN"
version: "1"
data:
  # Purge API token support (PR #7) was removed: the pipeline secret
  # 'CDN_PURGEKEY_101026' it referenced was never registered in Cloud
  # Manager, so every config-eds deploy since has failed. Re-add this
  # block once the secret exists as an actual pipeline variable.
  originSelectors:
    rules:
      # /mmm/login (and /<lang>/mmm/login) is a demo alias for 3M's B2B
      # ordering-portal login, which lives on a different subdomain/path
      # than www.3m.com. Must be matched (and listed) before the generic
      # route-3m-mmm rule below, since that rule's path pattern would
      # otherwise also match "/mmm/login" and send it to www.3m.com instead.
      - name: route-3m-mmm-login
        when:
          allOf:
            - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - { reqProperty: originalPath, matches: "^/([a-z]{2}/)?mmm/login/?$" }
        action:
          type: selectOrigin
          originName: order-3m
          skipCache: true
      - name: route-3m-mmm
        when:
          allOf:
            - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - { reqProperty: originalPath, matches: "^/([a-z]{2}/)?mmm(/|$)" }
        action:
          type: selectOrigin
          originName: 3m-www
          skipCache: true
      # www.3m.com pages reference these asset paths as root-relative URLs
      # (e.g. /en_US/..., /3m_theme_assets/...). Once the browser is on
      # 3m.ynaka-adobe.com (from the route-3m-mmm proxy above), those
      # root-relative requests land back on this domain instead of
      # www.3m.com, so they must also be sent to the 3m-www origin.
      - name: route-3m-mmm-assets
        when:
          allOf:
            - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - anyOf:
                - { reqProperty: path, matches: "^/en_US/" }
                - { reqProperty: path, matches: "^/3m_theme_assets/" }
                - { reqProperty: path, matches: "^/3M/" }
                - { reqProperty: path, matches: "^/etc\\.clientlibs/" }
                - { reqProperty: path, matches: "^/etc/" }
                - { reqProperty: path, matches: "^/content/dam/" }
                - { reqProperty: path, matches: "^/wps/" }
                - { reqProperty: path, matches: "^/akam/" }
                - { reqProperty: path, equals: "/favicon.ico" }
        action:
          type: selectOrigin
          originName: 3m-www
          skipCache: true
      # bCom (order.3m.com) serves its own CSS/JS/image assets and sub-pages
      # under root-relative /store/... paths. Once proxied onto
      # 3m.ynaka-adobe.com (via route-3m-mmm-login above), those requests
      # must also be routed to the order-3m origin instead of falling
      # through to the EDS origin.
      - name: route-3m-order-assets
        when:
          allOf:
            - { reqProperty: domain, equals: "3m.ynaka-adobe.com" }
            - { reqProperty: path, matches: "^/store/" }
        action:
          type: selectOrigin
          originName: order-3m
          skipCache: true
      - name: route-persona-home
        when:
          allOf:
            - { reqProperty: domain, equals: "dupont.ynaka-adobe.com" }
            - { reqProperty: path, equals: "/" }
        action: { type: selectAemOrigin, originName: edgefunction-dupont-persona, skipCache: true }
      # xsc-demo Closed User Groups: every page/fragment/media request on
      # xsc-demo.ynaka-adobe.com goes through the xsc-demo-cug edge function,
      # which enforces Okta login. Code paths go through it too, because the
      # function adds the aem.live site-authentication token to origin requests.
      - name: route-xsc-demo-cug
        when:
          allOf:
            - { reqProperty: domain, equals: "xsc-demo.ynaka-adobe.com" }
        action: { type: selectAemOrigin, originName: edgefunction-xsc-demo-cug, skipCache: true }
      # fmc-dealer-communications (Ford) reuses the same function and Okta app;
      # src/sites.js maps this host to its own EDS origin.
      - name: route-fmc-dealer-communications-cug
        when:
          allOf:
            - { reqProperty: domain, equals: "fmc-dealer-communications.ynaka-adobe.com" }
        action: { type: selectAemOrigin, originName: edgefunction-xsc-demo-cug, skipCache: true }
      # dealer-communications (generic copy of the communications demo) reuses the same
      # function; src/sites.js maps this host to its own EDS origin.
      - name: route-dealer-communications-cug
        when:
          allOf:
            - { reqProperty: domain, equals: "dealer-communications.ynaka-adobe.com" }
        action: { type: selectAemOrigin, originName: edgefunction-xsc-demo-cug, skipCache: true }
      # Parker product pages (series + nested SKU pages) are built on a
      # separate EDS site (ynaka-adobe/parker), not this AEM instance.
      # Scoped to parker.ynaka-adobe.com only, so it cannot match any
      # other domain sharing this CDN config.
      - name: route-parker-products
        when:
          allOf:
            - { reqProperty: domain, equals: "parker.ynaka-adobe.com" }
            - { reqProperty: originalPath, matches: "^/us/en/products(/|$)" }
        action:
          type: selectOrigin
          originName: parker-eds
          skipCache: true
      - name: route-chevron-edge-commerce-pilot
        when:
          allOf:
            - { reqProperty: domain, equals: "chevronlubricants.ynaka-adobe.com" }
            - anyOf:
                - { reqProperty: originalPath, equals: "/edge-commerce/products/delo-600-adf-15w-40" }
                - { reqProperty: originalPath, equals: "/edge-commerce/products/media_d8320c16ba6e000b2cb939cd08c2fa9d06c5a5b1.png" }
        action:
          type: selectOrigin
          originName: chevron-edge-commerce-pilot
          skipCache: true
          headers:
            X-Forwarded-Host: chevronlubricants.ynaka-adobe.com
      - name: route-chevron-delo-syn-trans-xe
        when:
          allOf:
            - { reqProperty: domain, equals: "chevronlubricants.ynaka-adobe.com" }
            - anyOf:
                - { reqProperty: originalPath, equals: "/en-us/home/products/delo-syn-trans-xe" }
                - { reqProperty: originalPath, equals: "/en-us/home/products/media_8c90e2b40526fb1677b313d1c434513f5dcb7d8c.png" }
        action:
